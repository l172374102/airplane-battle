<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1425">
  <meta name="api-base" content="https://airplane-battle-online.airplane-battle.workers.dev">
  <title>✈️ 空战棋盘</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>✈️ 空战棋盘</h1>
    <div class="sub">10×10 · 3/4 架飞机 · 联网 / 人机 / 同机双人</div>
  </header>

  <section class="card" id="home">
    <h2>选择游戏模式</h2>
    <div class="mode-grid">
      <button data-mode="online">🌐 联网对战<small>两部手机实时同步</small></button>
      <button class="secondary" data-mode="ai">🤖 人机对战<small>与电脑轮流攻击</small></button>
      <button class="secondary" data-mode="same">👥 同机双人<small>轮流传递手机</small></button>
    </div>

    <div id="onlineSetup" class="setup-panel">
      <h3>联网对战</h3>
      <div class="row">每人飞机
        <select id="onlineCount"><option value="3">3 架</option><option value="4">4 架</option></select>
        <button id="create">创建房间</button>
      </div>
      <div class="row">
        <input id="roomInput" aria-label="房间号" placeholder="输入6位房间号" inputmode="numeric" maxlength="6">
        <button id="join">加入房间</button>
      </div>
      <p class="small">玩家1创建房间后，将房间号或邀请链接发给玩家2。双方分别布阵，准备完成后自动开始。</p>
    </div>

    <div id="localSetup" class="setup-panel hide">
      <h3 id="localModeTitle">人机对战</h3>
      <div class="row">每人飞机
        <select id="localCount"><option value="3">3 架</option><option value="4">4 架</option></select>
        <button id="startLocal">开始游戏</button>
      </div>
      <p class="small" id="localModeHelp"></p>
    </div>
  </section>

  <section class="card hide" id="onlineGame">
    <div class="title-row"><h2 id="onlineHeading"></h2><button class="ghost" id="onlineHome">返回首页</button></div>
    <div class="notice" id="onlineStatus"></div>
    <div class="row" id="shareRow"><button id="share">分享邀请链接</button><strong id="roomText"></strong></div>
    <div id="onlinePlacement" class="hide">
      <div class="row">飞机朝向
        <select id="onlineDir"><option value="U">↑ 向上</option><option value="R">→ 向右</option><option value="D">↓ 向下</option><option value="L">← 向左</option></select>
        <button class="secondary" id="onlineRandom">随机布阵</button>
        <button class="secondary" id="onlineUndo">撤销</button>
        <button id="onlineReady">完成布阵</button>
      </div>
      <div class="small">点击格子放置机头；金色为机头，蓝色为机身。飞机占10格（1–5–1–3），不能越界或重叠。</div>
    </div>
    <div id="onlineBoard"></div>
    <div id="onlineResult" class="small"></div>
    <div class="grid2">
      <div><h3>我的攻击记录</h3><div class="history" id="onlineMyHistory"></div></div>
      <div><h3>对方攻击记录</h3><div class="history" id="onlineTheirHistory"></div></div>
    </div>
    <div id="onlineReveal" class="hide"><h3>战后复盘：对方飞机布局</h3><div id="onlineEnemyBoard"></div></div>
  </section>

  <section class="card hide" id="localGame">
    <div class="title-row"><h2 id="localHeading"></h2><button class="ghost" id="localHome">返回首页</button></div>
    <div class="notice" id="localStatus"></div>
    <div id="handoff" class="handoff hide">
      <div class="handoff-icon">📱</div><h2 id="handoffTitle"></h2><p id="handoffText"></p><button id="handoffContinue">我已拿到手机</button>
    </div>
    <div id="localPlayArea">
      <div id="localPlacement" class="hide">
        <div class="row">飞机朝向
          <select id="localDir"><option value="U">↑ 向上</option><option value="R">→ 向右</option><option value="D">↓ 向下</option><option value="L">← 向左</option></select>
          <button class="secondary" id="localRandom">随机布阵</button>
          <button class="secondary" id="localUndo">撤销</button>
          <button id="localReady">完成布阵</button>
        </div>
        <div class="small">点击格子放置机头。布阵完成后，同机模式会先遮住棋盘再交给另一位玩家。</div>
      </div>
      <div id="localBoard"></div>
      <div class="grid2">
        <div><h3 id="localHistoryOneTitle">我的攻击记录</h3><div class="history" id="localHistoryOne"></div></div>
        <div><h3 id="localHistoryTwoTitle">对方攻击记录</h3><div class="history" id="localHistoryTwo"></div></div>
      </div>
      <div id="localReveal" class="hide">
        <h3>战后复盘：双方完整布局</h3>
        <div class="reveal-grid"><div><h4 id="revealTitle0">玩家1</h4><div id="localReveal0"></div></div><div><h4 id="revealTitle1">玩家2</h4><div id="localReveal1"></div></div></div>
      </div>
    </div>
  </section>

  <p class="message" id="message" role="status" aria-live="polite"></p>
</main>
<script src="./app.js"></script>
</body>
</html>
