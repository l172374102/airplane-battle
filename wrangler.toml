name = "airplane-battle-online"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
FRONTEND_ORIGIN = "https://l172374102.github.io/airplane-battle/"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
